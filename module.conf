ABK_MODULE_VERSION="0.1.0"
ABK_MODULE_DESCRIPTION="ABI/KMI bridge, security backport, feature porting, and display release spoof suite for Android 14 / Linux 6.1 and Android 13 / Linux 5.15, with 7.0.12 reference-tree support. Capabilities whose target types or files are absent on the older tree degrade to report-only instead of failing the build. Paused network and framebuffer bootlog implementations remain in-tree but are not public child ids."
